name: Deploy GitBook docs to GitHub Pages

# Manual only: publishing the docs site needs GitHub Pages enabled for the
# repository and a matching base path. Running it on every push would just add a
# failing check to unrelated commits, so trigger it by hand when you want it
# (Actions -> Deploy GitBook docs -> Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: gitbook-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitbook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to 9router.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: 9router/9router.github.io
          publish_branch: main
          publish_dir: gitbook/out
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
