name: Deploy deployer Worker

# Publishes the one-click installer (deployer/) that lets anyone install JB-Router on their own
# Cloudflare account by pasting an API token — see deployer/README.md.
#
# Repository secrets required:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit on the deployer account
#   CLOUDFLARE_ACCOUNT_ID  account that hosts jb-deployer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "JB-Router release the deployer should ship"
        required: true
        default: "v0.5.86"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build the application bundle
        run: npm run workers:build
      - name: Build the deploy payload (worker.js + assets.zip + meta)
        run: |
          node deployer/build/make-page.mjs
          node deployer/build/make-vendor.mjs
          node deployer/build/make-bundle.mjs --release "${{ inputs.release_tag }}"
      - name: Deploy jb-deployer
        working-directory: deployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
