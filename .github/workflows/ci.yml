name: CI

# Quality gate. Before this workflow existed the repository had no automated
# check at all: lint findings, test regressions and broken builds could only be
# caught by hand. Both guards are *regression* based (see scripts/ci/*) because
# the repo carries a known backlog.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (no new findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NOTE: install scripts must run — better-sqlite3 is a native addon and
      # several DB tests assert on it. With --ignore-scripts the driver chain
      # silently falls back to node:sqlite and those tests fail on CI only.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: ESLint regression guard
        run: node scripts/ci/lint-guard.mjs

  test:
    name: Unit tests (no regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NOTE: install scripts must run — better-sqlite3 is a native addon and
      # several DB tests assert on it. With --ignore-scripts the driver chain
      # silently falls back to node:sqlite and those tests fail on CI only.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Verify native SQLite driver
        run: node -e "const D=require('better-sqlite3');const d=new D(':memory:');d.exec('select 1');d.close();console.log('better-sqlite3 OK')"
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Vitest regression guard
        run: node scripts/ci/test-guard.mjs

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NOTE: install scripts must run — better-sqlite3 is a native addon and
      # several DB tests assert on it. With --ignore-scripts the driver chain
      # silently falls back to node:sqlite and those tests fail on CI only.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
